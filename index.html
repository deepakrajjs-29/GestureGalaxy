<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gesture Particle Studio</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
background: radial-gradient(circle,#0f172a,#020617);
}

/* UI PANEL */

.ui{
position:absolute;
top:20px;
left:20px;
width:260px;
padding:20px;
border-radius:15px;

background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.1);

color:white;
}

.templates{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

button{

border:none;
padding:10px;
border-radius:8px;
cursor:pointer;

background:#1e293b;
color:white;

transition:.3s;
}

button:hover{
background:#6366f1;
transform:scale(1.05);
}

input[type=color]{
width:100%;
height:35px;
margin-top:10px;
border:none;
border-radius:6px;
}

video{
display:none;
}

</style>
</head>

<body>

<div class="ui">

<h3>Particle Studio</h3>

<div class="templates">

<button data-t="sphere">🪐 Saturn</button>
<button data-t="heart">❤️ Heart</button>
<button data-t="flower">🌸 Flower</button>
<button data-t="fireworks">🎆 Fireworks</button>

</div>

<label>Color</label>
<input type="color" id="color" value="#ff0066">

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

/* THREE JS SETUP */

let scene = new THREE.Scene()

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

camera.position.z = 4

let renderer = new THREE.WebGLRenderer({antialias:false})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5))
document.body.appendChild(renderer.domElement)

let particles
let particleCount = 800

createParticles("sphere")

/* PARTICLES */

function createParticles(type){

if(particles) scene.remove(particles)

let geometry = new THREE.BufferGeometry()
let pos=[]

for(let i=0;i<particleCount;i++){

let x,y,z

if(type=="sphere"){

let r=1.5*Math.random()
let theta=Math.random()*Math.PI*2
let phi=Math.random()*Math.PI

x=r*Math.sin(phi)*Math.cos(theta)
y=r*Math.sin(phi)*Math.sin(theta)
z=r*Math.cos(phi)

}

if(type=="heart"){

let t=Math.random()*Math.PI*2

x=16*Math.pow(Math.sin(t),3)/20
y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/20
z=(Math.random()-0.5)

}

if(type=="flower"){

let t=Math.random()*Math.PI*2

x=Math.cos(t)*(1+0.5*Math.cos(6*t))
y=Math.sin(t)*(1+0.5*Math.cos(6*t))
z=(Math.random()-0.5)

}

if(type=="fireworks"){

x=(Math.random()-0.5)*2
y=(Math.random()-0.5)*2
z=(Math.random()-0.5)*2

}

pos.push(x,y,z)

}

geometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(pos,3)
)

let material = new THREE.PointsMaterial({
size:0.03,
color:document.getElementById("color").value
})

particles = new THREE.Points(geometry,material)

scene.add(particles)

}

/* UI BUTTONS */

document.querySelectorAll("button").forEach(b=>{
b.onclick=()=>createParticles(b.dataset.t)
})

document.getElementById("color").oninput=e=>{
particles.material.color.set(e.target.value)
}

/* ANIMATION */

function animate(){

requestAnimationFrame(animate)

particles.rotation.y+=0.002

renderer.render(scene,camera)

}

animate()

/* HAND TRACKING */

let lastDistance = 0
let lastTime = Date.now()

const video=document.createElement("video")

const hands = new Hands({
locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
})

hands.setOptions({
maxNumHands:2,
modelComplexity:0,
minDetectionConfidence:0.6,
minTrackingConfidence:0.6
})

hands.onResults(results=>{

if(results.multiHandLandmarks.length==2){

let h1 = results.multiHandLandmarks[0][8]
let h2 = results.multiHandLandmarks[1][8]

let dx=h1.x-h2.x
let dy=h1.y-h2.y

let dist=Math.sqrt(dx*dx+dy*dy)

let now=Date.now()
let velocity=Math.abs(dist-lastDistance)/(now-lastTime)

lastDistance=dist
lastTime=now

/* SCALE CONTROL */

let scale = dist*6
particles.scale.set(scale,scale,scale)

/* SUDDEN GESTURE EXPLOSION */

if(velocity>0.003){

let p=particles.geometry.attributes.position.array

for(let i=0;i<p.length;i++){

p[i]+= (Math.random()-0.5)*0.2

}

particles.geometry.attributes.position.needsUpdate=true

}

}

})

/* CAMERA */

const cam=new Camera(video,{
onFrame:async()=>{
await hands.send({image:video})
},
width:320,
height:240
})

cam.start()

</script>

</body>
</html>
