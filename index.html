<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Studio</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
background: radial-gradient(circle,#0f172a,#020617);
}

/* UI PANEL */

.ui-panel{
position:absolute;
top:25px;
left:25px;
width:270px;
padding:20px;
background:rgba(255,255,255,0.05);
backdrop-filter: blur(15px);
border-radius:15px;
border:1px solid rgba(255,255,255,0.1);
color:white;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.ui-panel h2{
margin:0;
margin-bottom:15px;
font-weight:600;
}

/* TEMPLATE BUTTONS */

.template-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.template-btn{

padding:10px;
border:none;
border-radius:10px;
cursor:pointer;

background:linear-gradient(145deg,#1e293b,#020617);
color:white;

transition:0.3s;
}

.template-btn:hover{

transform:scale(1.05);
background:linear-gradient(145deg,#6366f1,#4338ca);

}

.color-section{
margin-top:20px;
}

input[type=color]{
width:100%;
height:40px;
border:none;
border-radius:8px;
margin-top:8px;
cursor:pointer;
}

video{
display:none;
}

</style>
</head>

<body>

<div class="ui-panel">

<h2>✨ Particle Studio</h2>

<div class="template-grid">

<button class="template-btn" data-template="heart">❤️ Heart</button>
<button class="template-btn" data-template="flower">🌸 Flower</button>
<button class="template-btn" data-template="sphere">🪐 Saturn</button>
<button class="template-btn" data-template="buddha">🧘 Buddha</button>
<button class="template-btn" data-template="fireworks">🎆 Fireworks</button>

</div>

<div class="color-section">
<label>Particle Color</label>
<input type="color" id="colorPicker" value="#ff0066">
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

/* THREE JS SETUP */

let scene,camera,renderer,particles;
let particleCount = 2000;

init();
animate();

function init(){

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 4;

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

createParticles("sphere");

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

});

}


/* PARTICLE GENERATOR */

function createParticles(type){

if(particles) scene.remove(particles);

let geometry = new THREE.BufferGeometry();
let positions = [];

for(let i=0;i<particleCount;i++){

let x,y,z;

if(type==="sphere"){

let r = 1.5*Math.random();
let theta = Math.random()*Math.PI*2;
let phi = Math.random()*Math.PI;

x = r*Math.sin(phi)*Math.cos(theta);
y = r*Math.sin(phi)*Math.sin(theta);
z = r*Math.cos(phi);

}

if(type==="heart"){

let t = Math.random()*Math.PI*2;

x = 16*Math.pow(Math.sin(t),3)/20;
y = (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/20;
z = (Math.random()-0.5);

}

if(type==="flower"){

let t = Math.random()*Math.PI*2;

x = Math.cos(t)*(1+0.5*Math.cos(6*t));
y = Math.sin(t)*(1+0.5*Math.cos(6*t));
z = (Math.random()-0.5);

}

if(type==="fireworks"){

x = (Math.random()-0.5)*2;
y = (Math.random()-0.5)*2;
z = (Math.random()-0.5)*2;

}

if(type==="buddha"){

x = (Math.random()-0.5)*1.5;
y = (Math.random()-0.5)*2;
z = (Math.random()-0.5)*1.5;

}

positions.push(x,y,z);

}

geometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(positions,3)
);

let material = new THREE.PointsMaterial({

size:0.03,
color:document.getElementById("colorPicker").value

});

particles = new THREE.Points(geometry,material);

scene.add(particles);

}


/* ANIMATION */

function animate(){

requestAnimationFrame(animate);

particles.rotation.y += 0.002;

renderer.render(scene,camera);

}


/* TEMPLATE BUTTONS */

document.querySelectorAll(".template-btn").forEach(btn=>{

btn.onclick=()=>{

createParticles(btn.dataset.template);

};

});


/* COLOR PICKER */

document.getElementById("colorPicker").oninput=(e)=>{

particles.material.color.set(e.target.value);

};



/* HAND TRACKING */

const video = document.createElement("video");

const hands = new Hands({
locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({

maxNumHands:2,
modelComplexity:1,
minDetectionConfidence:0.7,
minTrackingConfidence:0.7

});

hands.onResults(results=>{

if(results.multiHandLandmarks.length===2){

let h1 = results.multiHandLandmarks[0][8];
let h2 = results.multiHandLandmarks[1][8];

let dx = h1.x - h2.x;
let dy = h1.y - h2.y;

let distance = Math.sqrt(dx*dx + dy*dy);

let scale = distance * 6;

particles.scale.set(scale,scale,scale);

}

});


const cam = new Camera(video,{

onFrame: async()=>{
await hands.send({image:video});
},

width:640,
height:480

});

cam.start();

</script>

</body>
</html>
